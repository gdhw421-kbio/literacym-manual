<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>LiteracyM 사용자 매뉴얼</title>
<meta name="description" content="사용하시는 기기를 선택하면 회원가입·앱 설치·로그인 가이드가 열립니다." />
<meta name="theme-color" content="#f6f6f4" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f4; --surface:#ffffff; --ink:#1e1e1c; --ink-soft:#54534e; --ink-faint:#8b8a83;
  --line:#e5e5df; --line-soft:#f0f0ea; --accent:#FD3F33; --accent-soft:#fff1ef;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;padding:26px 18px 30px}

/* ---------- brand ---------- */
.brand{display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:24px;flex:none}
.brand .wm{font-family:'Inter',sans-serif;font-size:26px;font-weight:800;letter-spacing:-1.2px;line-height:1}
.brand .wm em{font-style:normal;color:var(--accent)}
.brand .ko{font-size:12px;font-weight:600;color:var(--ink-faint);letter-spacing:-.3px}

/* ---------- card ---------- */
.app{width:100%;max-width:440px;display:flex;flex-direction:column}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:22px 20px 22px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto;height:4px;
  background:linear-gradient(90deg,var(--accent),#ff8a5c 60%,#ffd166)}

/* ---------- step ---------- */
.step{display:none}
.step.on{display:block;animation:sin .26s ease both}
@keyframes sin{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.step.on{animation:none}}

.top{display:flex;align-items:center;gap:10px;min-height:30px;margin-bottom:14px}
.back{border:none;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--ink-faint);
  cursor:pointer;padding:6px 10px 6px 0;display:flex;align-items:center;gap:5px;border-radius:8px}
.back:hover{color:var(--accent)}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top .sp{flex:1}
.count{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink-faint)}
.count b{color:var(--accent)}

h1{font-family:'Inter','Noto Sans KR',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.5px;
  line-height:1.35;text-wrap:balance}
h1 span{display:block;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:500;
  color:var(--ink-faint);letter-spacing:-.3px;margin-top:5px}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:13px;width:100%;min-height:70px;padding:14px 16px;
  border:1.5px solid var(--line);border-radius:13px;background:var(--surface);
  font:inherit;color:var(--ink);text-align:left;text-decoration:none;cursor:pointer;
  transition:border-color .13s,background .13s,transform .08s;-webkit-tap-highlight-color:transparent}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt:active{transform:scale(.985)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt .ic{flex:none;width:34px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.opt:hover .ic{color:var(--accent)}
.opt .tx{flex:1;min-width:0}
.opt .main{display:block;font-family:'Inter','Noto Sans KR',sans-serif;font-size:17px;font-weight:700;
  letter-spacing:-.3px;line-height:1.3}
.opt .sub{display:block;font-size:12px;color:var(--ink-faint);margin-top:2px}
.opt .go{flex:none;font-family:'Inter',sans-serif;font-size:17px;color:#c8c8bf}
.opt:hover .go{color:var(--accent)}

/* ---------- footer ---------- */
.note{margin-top:16px;font-size:11.5px;color:var(--ink-faint);text-align:center;line-height:1.7}
.mark{font-family:'Inter',sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.09em;
  color:#a9a9a0;text-align:center;margin-top:20px;flex:none}

@media(min-width:520px){
  body{justify-content:center;padding:40px 20px}
  .card{padding:28px 28px 26px}
  h1{font-size:22px}
  .brand .wm{font-size:30px}
}

</style>
</head>
<body>

<div class="brand">
  <div class="wm">Literacy<em>M</em></div>
  <div class="ko">리터러시M</div>
</div>

<main class="app">
  <div class="card">

    <section class="step on" id="pick-device">
      <div class="top"><span class="sp"></span><span class="count"><b>1</b> / 1</span></div>
      <h1>사용하시는 기기를 선택하세요</h1>
      <div class="opts">
        <a class="opt" href="literacym-guide-android-ko.html">
          <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="2.4"/><path d="M9.6 18.8h4.8"/></svg></span>
          <span class="tx"><span class="main">Android</span><span class="sub">안드로이드</span></span>
          <span class="go">&rarr;</span>
        </a>
        <a class="opt" href="literacym-guide-iphone-ko.html">
          <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="3.2"/><path d="M10.2 5.1h3.6"/><path d="M10.4 19.2h3.2"/></svg></span>
          <span class="tx"><span class="main">iPhone</span><span class="sub">아이폰·iOS</span></span>
          <span class="go">&rarr;</span>
        </a>
      </div>
    </section>

  </div>
</main>

<div class="mark">KBIOHEALTHCARE · KYUNG HEE UNIVERSITY MEDICAL CENTER · MEDIJOY</div>

<script>
(function () {
  var steps = document.querySelectorAll(".step");
  if (steps.length < 2) return;
  function show(id) {
    steps.forEach(function (s) { s.classList.toggle("on", s.id === id); });
    if (history.replaceState) history.replaceState(null, "", "#" + id);
    window.scrollTo(0, 0);
  }
  document.querySelectorAll("[data-go]").forEach(function (b) {
    b.addEventListener("click", function () { show(b.dataset.go); });
  });
  var h = (location.hash || "").slice(1);
  if (h && document.getElementById(h)) show(h);
  window.addEventListener("hashchange", function () {
    var id = (location.hash || "").slice(1) || "pick-lang";
    if (document.getElementById(id)) show(id);
  });
})();
</script>
</body>
</html>
